- action: create_file
  arguments:
      file_path: TempTestData/check_yaml.txt
      file_content: |
          This is another test.
          Second line.
          Third line.
  _comment: Создаёт тестовый файл

- action: read_file
  arguments:
      file_path: TempTestData/check_yaml.txt
  _comment: Читает его содержимое

- action: replace_in_file
  arguments:
      file_path: TempTestData/check_yaml.txt
      search: another
      replace: a simple
      occurrence: 1
  _comment: Заменяет первое вхождение

- action: read_file
  arguments:
      file_path: TempTestData/check_yaml.txt
  _comment: Проверяет результат замены

- action: delete_file
  arguments:
      file_path: TempTestData/check_yaml.txt
  _comment: Удаляет тестовый файл